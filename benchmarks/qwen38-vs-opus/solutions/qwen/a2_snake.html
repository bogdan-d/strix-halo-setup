<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1a1a2e;
    color: #eee;
    font-family: monospace;
  }
  #score {
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  canvas {
    border: 2px solid #444;
    background: #16213e;
  }
  #msg {
    margin-top: 8px;
    font-size: 1.1rem;
    color: #e94560;
    min-height: 1.4em;
  }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="board" width="400" height="400"></canvas>
<div id="msg"></div>
<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const msgEl = document.getElementById('msg');

  const COLS = 20;
  const ROWS = 20;
  const CELL = canvas.width / COLS;
  const TICK_MS = 120;

  let snake, dir, nextDir, food, score, gameOver, timer;

  function reset() {
    snake = [{ x: 10, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    msgEl.textContent = '';
    scoreEl.textContent = 'Score: 0';
    placeFood();
    if (timer) clearInterval(timer);
    timer = setInterval(tick, TICK_MS);
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function tick() {
    if (gameOver) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame();
      return;
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = 'Score: ' + score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    gameOver = true;
    clearInterval(timer);
    msgEl.textContent = 'Game Over — press any arrow key to restart';
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Food
    ctx.fillStyle = '#e94560';
    ctx.fillRect(food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);

    // Snake
    for (let i = 0; i < snake.length; i++) {
      ctx.fillStyle = i === 0 ? '#0f3460' : '#53a8b6';
      ctx.fillRect(snake[i].x * CELL + 1, snake[i].y * CELL + 1, CELL - 2, CELL - 2);
    }
  }

  document.addEventListener('keydown', function (e) {
    const key = e.key;
    if (key === 'ArrowUp' && dir.y !== 1) nextDir = { x: 0, y: -1 };
    else if (key === 'ArrowDown' && dir.y !== -1) nextDir = { x: 0, y: 1 };
    else if (key === 'ArrowLeft' && dir.x !== 1) nextDir = { x: -1, y: 0 };
    else if (key === 'ArrowRight' && dir.x !== -1) nextDir = { x: 1, y: 0 };
    else return;

    e.preventDefault();

    if (gameOver) reset();
  });

  // Initial draw + start
  reset();
  draw();
})();
</script>
</body>
</html>
